# Phase 0 simulation defaults.
# NOTE: the tracker's measurement sigmas must match the simulator's noise
# sigmas — they are the same physical quantities. Change them together.

target_generator_node:
  ros__parameters:
    trajectory_type: figure_eight   # 'circle' or 'figure_eight'
    center_x: 8.0
    center_y: 0.0
    center_z: 3.0
    size_m: 3.0
    period_s: 20.0
    update_rate_hz: 10.0
    sigma_range_m: 0.1
    sigma_azimuth_rad: 0.02
    sigma_elevation_rad: 0.02
    sigma_doppler_mps: 0.1
    detection_probability: 0.9
    clutter_mean_count: 0.5
    base_snr_db: 25.0
    seed: 0                         # 0 = random seed each run
    frame_id: radar_link

preprocessor_node:
  ros__parameters:
    min_snr_db: 5.0
    min_range_m: 0.3
    max_range_m: 30.0
    # The simulated drone is always moving, so zero-doppler rejection is
    # safe here. Disable for hover experiments on hardware.
    enable_static_clutter_filter: true
    min_abs_radial_velocity_mps: 0.05
    enable_clustering: false        # simulator emits one point per target
    cluster_eps_m: 0.5
    cluster_min_samples: 2
    cluster_keep_noise: true

tracker_node:
  ros__parameters:
    motion_model: imm               # 'cv' = single constant-velocity EKF,
                                    # 'imm' = constant-velocity + constant-
                                    # acceleration bank (handles maneuvers)
    sigma_accel: 3.0                # 'cv' model only; ignored by 'imm'
    sigma_range_m: 0.1
    sigma_azimuth_rad: 0.02
    sigma_elevation_rad: 0.02
    sigma_doppler_mps: 0.1
    gate_chi2: 9.488                # chi-square 95th percentile, 4 DOF
    confirm_hits: 3
    max_misses: 8
    initial_velocity_sigma: 5.0
    max_coast_dt_s: 1.0
    # IMM tuning. The CV mode deliberately does NOT reuse sigma_accel: that
    # value is inflated so a lone CV filter can survive turns, which would
    # blur the CV mode into a second CA mode and defeat the model bank.
    initial_accel_sigma: 2.0        # birth uncertainty on acceleration, m/s^2
    imm_sigma_accel: 2.0            # CV mode process noise, m/s^2
    imm_sigma_jerk: 4.0             # CA mode process noise, m/s^3
    imm_p_cv_to_ca: 0.05            # ~2 s expected straight-leg dwell at 10 Hz
    imm_p_ca_to_cv: 0.10            # ~1 s expected maneuver dwell at 10 Hz

visualizer_node:
  ros__parameters:
    marker_lifetime_s: 0.5
    track_sphere_scale: 0.3
    velocity_arrow_scale: 0.5
    show_covariance: true
    show_detections: true
    detection_point_scale: 0.12

logger_node:
  ros__parameters:
    output_dir: '~/echo_pigeon_logs'
    enable: true
    flush_every_n: 50
